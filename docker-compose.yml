services:
    db:
        build: .
        container_name: postgres_labs
        restart: no
        environment:
            POSTGRES_USER: student
            POSTGRES_PASSWORD: secretpassword
            POSTGRES_DB: lab_db
        ports:
            - "5433:5432"
        volumes:
            - type: tmpfs
              target: /var/lib/postgresql
            - type: bind
              source: ./data
              target: /var/lib/postgresql/csv_data
              read_only: true
